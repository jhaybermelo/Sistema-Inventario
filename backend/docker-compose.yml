services:
  postgres-db:
    image: postgres:15
    container_name: facturacion-db
    environment:
      POSTGRES_DB: facturacion
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      TZ: America/Bogota
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - facturacion-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: facturacion-backend
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - .:/app
      - uploads:/app/uploads
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - facturacion-net
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

# La red tiene nombre fijo para que el frontend (otro compose) pueda unirse a ella.
networks:
  facturacion-net:
    name: facturacion-net

volumes:
  pgdata:
  uploads:
